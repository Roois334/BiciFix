{% extends "base.html" %}
{% block title %}Recuperar Contraseña — BiciFix{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card animate-in">
    <div class="auth-logo">
      <div class="auth-logo-big brand-logo-img" style="margin:0 auto 14px;">
        <img src="/static/img/logo.png" alt="BiciFix" class="brand-logo-image">
      </div>
      <p class="auth-subtitle">Recupera tu contraseña</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <input type="email" name="email" class="form-input" placeholder="tu@correo.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Nueva contraseña</label>
        <input type="password" name="nueva" class="form-input" placeholder="Mínimo 6 caracteres" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar nueva contraseña</label>
        <input type="password" name="confirmar" class="form-input" placeholder="Repite tu contraseña" required>
      </div>
      <button type="submit" class="btn btn-neon btn-full">Cambiar contraseña</button>
    </form>
    <div style="text-align:center;margin-top:20px;font-size:.85rem;">
      <a href="/login" class="auth-link">← Volver al login</a>
    </div>
  </div>
</div>
{% endblock %}
